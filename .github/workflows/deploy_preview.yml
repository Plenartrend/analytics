name: "Deploy Docker Images to Nexus"

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lint:
    runs-on:
      ubuntu-latest
    # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --frozen --no-install-project --no-dev

      - name: Lint
        run: uv run ruff check
  push_to_registry:
    name: Push Docker image to Nexus
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    needs:
      - lint
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Nexus Docker registry
        uses: docker/login-action@v3
        with:
          registry: registry.sokutan.de
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push Docker image analytics
        uses: docker/build-push-action@v6
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: registry.sokutan.de/plenartrend/analytics:preview

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ARGO_SSH_PRIVATE_KEY }}

      - name: Clone manifests repository
        run: |
          git clone git@github.com:Plenartrend/infrastructure.git manifests-repo
          cd manifests-repo
          git config user.name "GitHub Actions Analytics"
          git config user.email "actions@github.com"

      - name: Update deployment manifest
        run: |
          cd manifests-repo
          IMAGE_TAG="${{ github.sha }}"
          sed -i "s|image: registry.sokutan.de/plenartrend/analytics:.*|image: registry.sokutan.de/plenartrend/analytics:${IMAGE_TAG}|" manifests/analytics/analytics-deployment.yml

      - name: Commit and push changes
        run: |
          cd manifests-repo
          git add manifests/analytics/analytics-deployment.yml
          git commit -m "Update analytics deployment to ${{ github.sha }}" || exit 0
          git push origin main
